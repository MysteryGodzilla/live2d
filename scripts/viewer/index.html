<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live2D viewer</title>
<!-- The kit's viewer: each built model drawn with the real Cubism renderer, the same libraries
     AIRI draws Live2D with: pixi.js 6.5.10 and pixi-live2d-display 0.4.0 (MIT), over Live2D's own
     Cubism Core for the web (Live2D's licence; loaded from Live2D's address, so it needs the
     internet). Served by the kit's view.py at /live2d/; every address below is beside this page.

     For checking a model without looking at the screen (an agent, or a test), the page has
     window.sheets: pictures of held poses, of a motion's frames and of expressions, drawn by
     reading the renderer's pixels back, so they are right even while the page is hidden.
       await sheets.poses([["face", url, /face/i, 1.6, [["rest", {}], ["turn", {ParamAngleX: 30}]]]], 200, 250)
       await sheets.motion(url, "TapHead", /face/i, 1.6, 133, 170, 6, 13)
       await sheets.expressions(url, ["(none)", "happy"], [0.25, 0, 0.75, 0.6], 0, 133, 300)
       await sheets.save("akane-face")      // the sheet as <out>/live2d/checks/akane-face.png
     A frame is [x0, y0, x1, y1] in shares of the model's box, or a pattern for a drawable's name
     to centre on with a zoom (how many of that drawable's heights the picture is tall). -->
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
<style>
  :root { color-scheme: dark; --bg: #16181d; --panel: #20232a; --line: #33363f; --text: #e6e6ea; --dim: #9a9ca5; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif;
         display: grid; grid-template-columns: 1fr 320px; height: 100vh; }
  #stage { position: relative; overflow: hidden; }
  #stage.light { background: #ececf0; } #stage.room { background: #5b4a3c; } #stage.checks {
    background: repeating-conic-gradient(#999 0 25%, #ccc 0 50%) 0 0 / 24px 24px; }
  #canvas { display: block; width: 100%; height: 100%; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 12px; overflow-y: auto; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 16px 0 6px; }
  select, button { font: inherit; background: var(--bg); color: var(--text); border: 1px solid var(--line);
                   border-radius: 6px; padding: 4px 8px; margin: 0 4px 4px 0; }
  button:hover { border-color: var(--dim); }
  label.slider { display: grid; grid-template-columns: 110px 1fr 44px; align-items: center; gap: 6px; font-size: 12px; }
  #info { color: var(--dim); font-size: 12px; white-space: pre-wrap; }
  #sheet-out { position: fixed; left: 0; top: 0; z-index: 10; max-width: none; }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: 60vh auto; } }
</style>
<div id="stage"><canvas id="canvas"></canvas></div>
<aside>
  <select id="who"></select>
  <select id="bg">
    <option value="">dark</option><option value="light">light</option>
    <option value="room">room</option><option value="checks">checks</option>
  </select>
  <select id="framing"><option value="">whole</option><option value="face">face</option></select>
  <h2>Motions</h2>
  <div id="motions"></div>
  <button id="talk">Talk 3 s</button>
  <button id="sheet" title="Held poses, face and whole, saved to <out>/live2d/checks/<name>-sheet.png">Sheet</button>
  <h2>Expressions</h2>
  <div id="expressions"></div>
  <h2>Hold a pose</h2>
  <label><input type="checkbox" id="hold"> hold her at these (motions and physics stop)</label>
  <button id="rest">All to rest</button>
  <div id="sliders"></div>
  <h2>Model</h2>
  <div id="info"></div>
</aside>
<script>
const stage = document.getElementById("stage");
const app = new PIXI.Application({ view: document.getElementById("canvas"), resizeTo: stage,
                                   backgroundAlpha: 0, antialias: true });
const view = window.view = { app, model: null, talkUntil: 0, loading: 0 };
const hold = document.getElementById("hold");
const sliders = document.getElementById("sliders");

// Where she is in the picture: a frame (see the top of the page), or the whole of her.
function place(frame, zoom, w = app.screen.width, h = app.screen.height) {
  const m = view.model;
  if (!m) return;
  m.scale.set(1);
  if (Array.isArray(frame)) {
    const W = m.width, H = m.height, [x0, y0, x1, y1] = frame;
    const s = Math.min(h / (H * (y1 - y0)), w / (W * (x1 - x0)));
    m.scale.set(s);
    m.x = (w - (x1 - x0) * W * s) / 2 - x0 * W * s;
    m.y = (h - (y1 - y0) * H * s) / 2 - y0 * H * s;
    return;
  }
  const im = m.internalModel;
  const i = frame ? [...im.coreModel.getModel().drawables.ids].findIndex((d) => frame.test(d)) : -1;
  if (i >= 0) {
    const b = im.getDrawableBounds(i, {});
    const s = h / (b.height * (zoom || 2.6));
    m.scale.set(s);
    m.x = w / 2 - (b.x + b.width / 2) * s;
    m.y = h / 2 - (b.y + b.height * 0.45) * s;
    return;
  }
  const s = Math.min(h * 0.94 / m.height, w * 0.9 / m.width);
  m.scale.set(s);
  m.x = (w - m.width) / 2;
  m.y = (h - m.height) / 2;
}
const fit = () => place(document.getElementById("framing").value === "face" ? /face/i : null);

async function load(url) {
  const mine = ++view.loading;
  // The one before goes first, with its textures: pixi keeps them by address, and a rebuilt model
  // has the same address. (After the new one is loaded would be too late: they would be its textures too.)
  for (const old of [...app.stage.children]) {
    app.stage.removeChild(old);
    old.destroy({ children: true, texture: true, baseTexture: true });
  }
  view.model = null;
  const m = await PIXI.live2d.Live2DModel.from(url, { autoInteract: true });
  if (mine !== view.loading) { m.destroy(); return; }  // another was picked while this one loaded
  view.model = m;
  app.stage.addChild(m);
  fit();
  const core = m.internalModel.coreModel;
  const raw = core.getModel();  // the Cubism Core's own model
  const ids = [...raw.parameters.ids];
  m.internalModel.on("beforeModelUpdate", () => {
    if (hold.checked) for (const input of sliders.querySelectorAll("input")) core.setParameterValueById(input.name, +input.value);
    if (performance.now() < view.talkUntil) {
      const t = performance.now() / 1000;
      const mouth = ids.includes("ParamMouthOpenY") ? "ParamMouthOpenY" : "PARAM_MOUTH_OPEN_Y";
      core.setParameterValueById(mouth, Math.max(0, Math.sin(t * 11) * 0.6 + Math.sin(t * 17) * 0.4));
    }
  });

  const motions = document.getElementById("motions");
  motions.replaceChildren();
  const groups = m.internalModel.settings.motions || {};
  for (const [group, list] of Object.entries(groups)) {
    list.forEach((_, i) => {
      const b = document.createElement("button");
      b.textContent = (group || "(none)") + (list.length > 1 ? " " + (i + 1) : "");
      b.onclick = () => { hold.checked = false; m.motion(group, i, 3); };
      motions.append(b);
    });
  }
  // Expressions: each one held until another, or none, is picked.
  const expressions = document.getElementById("expressions");
  expressions.replaceChildren();
  const named = (m.internalModel.settings.expressions || []).map((e) => e.Name || e.name);
  for (const name of named.length ? ["none", ...named] : []) {
    const b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => { hold.checked = false; express(name === "none" ? null : name); };
    expressions.append(b);
  }
  // A slider for each of her parameters.
  sliders.replaceChildren();
  ids.forEach((name, i) => {
    const min = raw.parameters.minimumValues[i], max = raw.parameters.maximumValues[i], rest = raw.parameters.defaultValues[i];
    const label = document.createElement("label");
    label.className = "slider";
    label.innerHTML = `<span>${name.replace(/^Param|^PARAM_/, "")}</span><input type="range" name="${name}" min="${min}" max="${max}" step="${(max - min) / 200}" value="${rest}" data-rest="${rest}"><output>${rest}</output>`;
    const input = label.querySelector("input");
    input.oninput = () => { label.querySelector("output").textContent = (+input.value).toFixed(2); hold.checked = true; };
    sliders.append(label);
  });
  document.getElementById("info").textContent =
    `${ids.length} parameters, ${raw.drawables.count} drawables\n` +
    `${Object.keys(groups).length} motion groups, ${named.length} expressions`;
}

function express(name) {
  const manager = view.model.internalModel.motionManager.expressionManager;
  return name ? view.model.expression(name) : manager && manager.resetExpression();
}

// A held pose: pose({ParamEyeLOpen: 0, ...}), her other parameters at rest.
window.pose = (vals) => {
  for (const input of sliders.querySelectorAll("input")) {
    input.value = vals[input.name] ?? input.dataset.rest;
    input.nextElementSibling.textContent = (+input.value).toFixed(2);
  }
  hold.checked = true;
  view.model.internalModel.motionManager.stopAllMotions();
};

document.getElementById("rest").onclick = () => { pose({}); hold.checked = false; };
document.getElementById("talk").onclick = () => { hold.checked = false; view.talkUntil = performance.now() + 3000; };
document.getElementById("bg").onchange = (e) => { stage.className = e.target.value; };
document.getElementById("framing").onchange = fit;
new ResizeObserver(() => { if (app.resizeTo) fit(); }).observe(stage);

// ---- Check sheets -------------------------------------------------------------------------------
const sheets = window.sheets = {
  // What the renderer has just drawn, read back (premultiplied, bottom row first) as a canvas.
  grab() {
    app.renderer.render(app.stage);
    const gl = app.renderer.gl, W = gl.drawingBufferWidth, H = gl.drawingBufferHeight;
    const px = new Uint8Array(W * H * 4);
    gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
    const image = new ImageData(W, H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const s = ((H - 1 - y) * W + x) * 4, d = (y * W + x) * 4, a = px[s + 3];
      image.data[d + 3] = a;
      if (a) for (let c = 0; c < 3; c++) image.data[d + c] = Math.min(255, px[s + c] * 255 / a);
    }
    const canvas = document.createElement("canvas");
    canvas.width = W; canvas.height = H;
    canvas.getContext("2d").putImageData(image, 0, 0);
    return canvas;
  },
  // Time moved on by hand: `frames` updates of 33 ms, so nothing depends on the screen's own clock.
  step(frames) {
    for (let i = 0; i < frames; i++) { view.model.update(33); app.renderer.render(app.stage); }
  },
  start(w, h, cols, rows, bg) {
    document.getElementById("sheet-out")?.remove();
    const canvas = document.createElement("canvas");
    canvas.id = "sheet-out";
    canvas.width = w * cols; canvas.height = (h + 20) * rows;
    canvas.style.width = canvas.width + "px"; canvas.style.height = canvas.height + "px";
    canvas.title = "click to put away";
    canvas.onclick = () => sheets.done();
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = bg || "#e8e8ec";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = "13px system-ui";
    sheets.ink = parseInt(ctx.fillStyle.slice(1, 3), 16) < 128 ? "#8cffdc" : "#103";  // labels that show on it
    app.resizeTo = null;
    app.renderer.resize(w, h);
    return [canvas, ctx];
  },
  cell(ctx, col, row, w, h, label) {
    const shot = sheets.grab();
    ctx.drawImage(shot, 0, 0, shot.width, shot.height, col * w, row * (h + 20) + 20, w, h);
    ctx.fillStyle = sheets.ink;
    ctx.fillText(label, col * w + 4, row * (h + 20) + 14);
  },
  // Put the sheet away and give the page back.
  done() {
    document.getElementById("sheet-out")?.remove();
    app.resizeTo = stage;
    app.resize();
    hold.checked = false;
    fit();
  },
  // rows: [[name, url, frame, zoom, [[label, {parameter: value}], ...]], ...]: each pose held.
  async poses(rows, w, h, bg) {
    const [canvas, ctx] = sheets.start(w, h, Math.max(...rows.map((r) => r[4].length)), rows.length, bg);
    let last = null;
    for (const [r, [name, url, frame, zoom, poses]] of rows.entries()) {
      if (url !== last) { await load(url); last = url; }
      place(frame, zoom, w, h);
      for (const [c, [label, vals]] of poses.entries()) {
        pose(vals);
        sheets.step(30);
        sheets.cell(ctx, c, r, w, h, name + ": " + label);
      }
    }
    document.body.append(canvas);
    return canvas.width + "x" + canvas.height;
  },
  // n frames of one motion, `every` updates apart.
  async motion(url, group, frame, zoom, w, h, n, every, bg) {
    const [canvas, ctx] = sheets.start(w, h, n, 1, bg);
    await load(url);
    place(frame, zoom, w, h);
    hold.checked = false;
    await view.model.motion(group, 0, 3);
    for (let c = 0; c < n; c++) {
      sheets.step(every);
      sheets.cell(ctx, c, 0, w, h, group + " " + ((c + 1) * every * 0.033).toFixed(1) + " s");
    }
    document.body.append(canvas);
    return canvas.width + "x" + canvas.height;
  },
  // Each expression held ("(none)" for none).
  async expressions(url, names, frame, zoom, w, h, bg) {
    const [canvas, ctx] = sheets.start(w, h, names.length, 1, bg);
    await load(url);
    place(frame, zoom, w, h);
    hold.checked = false;
    view.model.internalModel.motionManager.stopAllMotions();
    for (const [c, name] of names.entries()) {
      await express(name === "(none)" ? null : name);
      sheets.step(45);
      sheets.cell(ctx, c, 0, w, h, name);
    }
    express(null);
    document.body.append(canvas);
    return canvas.width + "x" + canvas.height;
  },
  // The sheet on screen saved by the viewer's server, or handed to the browser to download.
  async save(name) {
    const canvas = document.getElementById("sheet-out");
    const png = await new Promise((r) => canvas.toBlob(r, "image/png"));
    const res = await fetch("save/" + encodeURIComponent(name), { method: "POST", body: png }).catch(() => null);
    if (res && res.ok) return (await res.text()).trim();
    const link = document.createElement("a");
    link.href = URL.createObjectURL(png);
    link.download = name + ".png";
    link.click();
    return "downloaded " + link.download + " (this server doesn't save sheets)";
  },
};

// The Sheet button: the poses every model should hold up in, face and whole.
const SHEET = [
  ["rest", {}], ["blink", { ParamEyeLOpen: 0, ParamEyeROpen: 0 }], ["talk", { ParamMouthOpenY: 1 }],
  ["smile", { ParamMouthForm: 1 }], ["turn left", { ParamAngleX: -30 }], ["turn right", { ParamAngleX: 30 }],
  ["nod", { ParamAngleY: -30 }], ["tilt", { ParamAngleZ: 30 }], ["sway", { ParamBodyAngleX: 10 }],
];
document.getElementById("sheet").onclick = async () => {
  const button = document.getElementById("sheet"), url = document.getElementById("who").value;
  const name = document.getElementById("who").selectedOptions[0].dataset.name;
  button.disabled = true;
  // Whole: the middle of her picture, where a standing figure is.
  await sheets.poses([["face", url, /face/i, 2.6, SHEET], ["whole", url, [0.15, 0, 0.85, 1], 0, SHEET]], 200, 300, "#16181d");
  button.textContent = await sheets.save(name + "-sheet");
  button.disabled = false;
};

(async () => {
  const list = await (await fetch("models.json")).json();
  const who = document.getElementById("who");
  for (const m of list) {
    const option = new Option(m.example ? `${m.name} (example)` : m.name, m.url);
    option.dataset.name = m.name;
    who.add(option);
  }
  const want = new URLSearchParams(location.search).get("who");
  const pick = list.find((m) => m.name === want) || list[0];
  if (!pick) { document.getElementById("info").textContent = "No models yet: build one with `live2d.py build <name>`"; return; }
  who.value = pick.url;
  who.onchange = () => load(who.value);
  await load(pick.url);
})();
</script>
